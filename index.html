<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STAFF PORTAL LOGIN</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(120deg, #2980b9, #6dd5fa, #ffffff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s;
    }

    /* LOGIN SCREEN */
    #login-screen {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 360px;
      animation: fadeIn 0.8s ease-in;
    }

    #login-screen h1 {
      color: #003366;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="password"] {
      width: 85%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: linear-gradient(45deg, #2980b9, #6dd5fa);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(45deg, #0072ff, #00c6ff);
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }

    /* MAIN PORTAL PAGE */
    #main-page {
      display: none;
    }

    /* REUSE YOUR EXISTING CSS */
    .heading1 {
      font-family: 'Playfair Display', serif;
      font-size: 65px;
      font-weight: bold;
      text-shadow: 3px 3px 5px white;
      color: #002366;
      margin: 30px 0 0px 0;
      text-align: center;
    }

    .heading2 {
      font-family: 'Bookman Old Style', serif;
      font-size: 65px;
      font-weight: bold;
      text-transform: uppercase;
      color: #FFD700;
      -webkit-text-stroke: 2px black;
      text-shadow: 5px 5px 5px blue;
      text-align: center;
    }

    .heading3 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 3px 3px 5px yellow;
      color: white;
      text-align: center;
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      justify-items: center;
      margin: 50px auto;
      max-width: 80%;
    }

    .sub-buttons {
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    .watermark {
      position: fixed;
      bottom: 10px;
      right: 20px;
      opacity: 0.1;
      font-size: 120px;
      font-weight: bold;
      color: #0d47a1;
      user-select: none;
      pointer-events: none;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0, 35, 102, 0.6);
      color: white;
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    footer a {
      color: #FFD700;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h1>Staff Portal Login</h1>
    <input type="text" id="username" placeholder="Enter Username"><br>
    <input type="password" id="password" placeholder="Enter Password"><br>
    <button onclick="checkLogin()">Login</button>
    <div class="error" id="error-msg"></div>
  </div>

  <!-- MAIN STAFF PORTAL -->
  <div id="main-page">
    <div class="heading1">OPERATING DEPARTMENT</div>
    <div class="heading2">STAFF PORTAL</div>
    <div class="heading3">GUNTUR DIVISION</div>

    <div class="button-container">
      <div>
        <button onclick="toggleSubButtons('staffSub')">SEARCH_EMP_BY ⯆</button>
        <div id="staffSub" class="sub-buttons">
          <button onclick="openSub('https://docs.google.com/spreadsheets/d/...')">NAME..</button>
          <button onclick="openSub('https://docs.google.com/spreadsheets/d/...')">PF_NO.</button>
        </div>
      </div>
    </div>

    <div class="watermark">STAFF-HUB</div>

    <footer>
      <p>Designed for <strong>Staff Management</strong> | Powered by 
        <a href="https://gunturoperating-hub.github.io/TI-HOME/">
          Operating Department, GNT Division
        </a>
      </p>
    </footer>
  </div>

  <script>
    function checkLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (username === "TISTAFF" && password === "vijay@9966") {
        document.getElementById('login-screen').style.display = "none";
        document.getElementById('main-page').style.display = "block";
        document.body.style.background = "url('bbg.jpeg') no-repeat center center fixed";
        document.body.style.backgroundSize = "cover";
      } else {
        errorMsg.textContent = "❌ Invalid username or password!";
      }
    }

    // Toggle Submenus
    function toggleSubButtons(id) {
      document.querySelectorAll('.sub-buttons').forEach(sub => {
        if (sub.id !== id) sub.style.display = 'none';
      });
      const el = document.getElementById(id);
      el.style.display = (el.style.display === "block") ? "none" : "block";
    }

    function openSub(url) {
      window.open(url, '_blank');
    }

    // Close all menus when clicking outside
    document.addEventListener('click', function(event) {
      const isInsideSubmenu = event.target.closest('.sub-buttons');
      const isMainButton = event.target.closest('button');
      if (!isInsideSubmenu && !isMainButton) {
        document.querySelectorAll('.sub-buttons').forEach(sub => sub.style.display = 'none');
      }
    });
  </script>
</body>
</html>
